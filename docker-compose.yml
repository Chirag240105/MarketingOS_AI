services:
  postgres:
    image: postgres:16-alpine
    container_name: marketingos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketingos
      POSTGRES_USER: marketingos
      POSTGRES_PASSWORD: marketingos
    ports:
      - "5432:5432"
    volumes:
      - marketingos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketingos -d marketingos"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  marketingos_postgres_data:
